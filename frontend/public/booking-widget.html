<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; overflow-x: hidden; }

    :root {
      /* ── Container ─────────────────────────────────────────────────── */
      --ldg-bnb-background:              transparent;
      --ldg-bnb-border-radius:           14px;
      --ldg-bnb-box-shadow:              none;
      --ldg-bnb-padding:                 0px;

      /* ── Inputs ────────────────────────────────────────────────────── */
      --ldg-bnb-input-background:        rgba(6, 78, 59, 0.05);

      /* ── Buttons ───────────────────────────────────────────────────── */
      --ldg-bnb-button-border-radius:    9999px;

      /* ── Typography ────────────────────────────────────────────────── */
      --ldg-bnb-font-family:             'Nunito', 'DM Sans', system-ui, sans-serif;

      /* ── Brand palette ─────────────────────────────────────────────── */
      --ldg-bnb-color-primary:           #064E3B;
      --ldg-bnb-color-primary-lighter:   #34D399;
      --ldg-bnb-color-primary-darker:    #142923;
      --ldg-bnb-color-primary-contrast:  #F9FDF9;

      /* ── Calendar ──────────────────────────────────────────────────── */
      --ldg-component-calendar-cell-selection-bg-color: #064E3B;
      --ldg-component-calendar-cell-selection-color:    #F9FDF9;
      --ldg-component-calendar-cell-selected-bg-color:  rgba(52, 211, 153, 0.18);
      --ldg-component-calendar-cell-selected-color:     #064E3B;
    }

    #lodgify-book-now-box {
      width: 100%;
      max-width: 100%;
    }

    /* ── Guests trigger — match site input style ─────────────────────────
       Targets the clickable row that shows "1 adult" and opens the
       guests breakdown dialog.                                             */
    [data-testid="guests-breakdown-trigger"] {
      border-radius: 14px !important;
      border: 1.5px solid rgba(6, 78, 59, 0.15) !important;
      background: rgba(6, 78, 59, 0.05) !important;
      font-family: 'Nunito', 'DM Sans', system-ui, sans-serif !important;
      padding: 0.625rem 0.875rem !important;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }

    [data-testid="guests-breakdown-trigger"]:hover {
      border-color: rgba(52, 211, 153, 0.5) !important;
    }

    [data-testid="guests-breakdown-trigger"]:focus-within,
    [data-testid="guests-breakdown-trigger"][aria-expanded="true"] {
      border-color: rgba(52, 211, 153, 0.6) !important;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.12) !important;
    }

    /* Guests label ("Guests") */
    [data-testid="guests-breakdown-trigger"] > *:first-child {
      font-size: 0.62rem !important;
      letter-spacing: 0.2em !important;
      text-transform: uppercase !important;
      color: rgba(6, 78, 59, 0.45) !important;
      font-weight: 600 !important;
    }

    /* Guests value ("1 adult") */
    [data-testid="guests-breakdown-trigger"] > *:nth-child(2) {
      color: #064E3B !important;
      font-weight: 600 !important;
      font-size: 0.9rem !important;
    }

    /* ── Guests breakdown dialog ─────────────────────────────────────────
       The popup that opens when clicking the trigger.                     */
    [data-testid="book-now-box.guests-breakdown-dialog"] {
      border-radius: 1.25rem !important;
      border: 1.5px solid rgba(6, 78, 59, 0.1) !important;
      box-shadow: 0 8px 40px -8px rgba(6, 78, 59, 0.2) !important;
      font-family: 'Nunito', 'DM Sans', system-ui, sans-serif !important;
      padding: 1.25rem !important;
    }

    /* ── Quantity +/− buttons in the guests dialog ───────────────────── */
    [data-testid$="-add-button"],
    [data-testid$="-remove-button"] {
      border-radius: 100px !important;
      border: 1.5px solid rgba(6, 78, 59, 0.2) !important;
      background: rgba(6, 78, 59, 0.05) !important;
      color: #064E3B !important;
      font-weight: 700 !important;
      font-size: 1.1rem !important;
      transition: background 0.15s ease, border-color 0.15s ease !important;
    }

    [data-testid$="-add-button"]:hover,
    [data-testid$="-remove-button"]:hover {
      background: rgba(6, 78, 59, 0.12) !important;
      border-color: rgba(6, 78, 59, 0.35) !important;
    }

    [data-testid$="-add-button"]:disabled,
    [data-testid$="-remove-button"]:disabled {
      opacity: 0.3 !important;
    }

    /* ── Done button in guests dialog ────────────────────────────────── */
    [data-testid="book-now-box.guests-breakdown-done-cta"] {
      background: #064E3B !important;
      color: #F9FDF9 !important;
      border-radius: 9999px !important;
      font-family: 'Nunito', 'DM Sans', system-ui, sans-serif !important;
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      transition: background 0.2s ease !important;
    }

    [data-testid="book-now-box.guests-breakdown-done-cta"]:hover {
      background: #142923 !important;
    }

    /* ── Book Now CTA — amber to match site's primary CTA colour ─────── */
    a[href*="checkout.lodgify.com"] {
      background:     #F59E0B !important;
      border-color:   transparent !important;
      color:          #1a3328 !important;
      font-weight:    700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      border-radius:  9999px !important;
      transition:     background 0.2s ease, transform 0.15s ease !important;
    }

    a[href*="checkout.lodgify.com"]:hover {
      background: #D97706 !important;
      transform:  translateY(-1px) !important;
    }

    a[href*="checkout.lodgify.com"]:active {
      transform: translateY(0) !important;
    }

    /* ── Calendar dialog — full visual direction overhaul ───────────────
       The date-picker renders as [role="dialog"]. We target its container
       and every internal element to match the site's palette and fonts.   */

    /* Dialog shell */
    [role="dialog"] {
      border-radius: 1.35rem !important;
      border: 1.5px solid rgba(6, 78, 59, 0.1) !important;
      box-shadow:
        0 4px 6px -1px rgba(6, 78, 59, 0.06),
        0 16px 48px -8px rgba(6, 78, 59, 0.22) !important;
      overflow: visible !important;
    }

    /* Propagate site font to every node inside both dialogs */
    [role="dialog"],
    [role="dialog"] * {
      font-family: 'Nunito', 'DM Sans', system-ui, sans-serif !important;
    }

    /* ── Month / year header ─────────────────────────────────────────── */
    [role="dialog"] h2,
    [role="dialog"] [role="heading"] {
      color: #064E3B !important;
      font-weight: 700 !important;
      font-size: 0.9rem !important;
      letter-spacing: 0.01em !important;
    }

    /* ── Prev / Next navigation arrows ──────────────────────────────── */
    [role="dialog"] button[aria-label="Previous"],
    [role="dialog"] button[aria-label="Next"] {
      width: 2rem !important;
      height: 2rem !important;
      border-radius: 100px !important;
      background: rgba(6, 78, 59, 0.07) !important;
      color: #064E3B !important;
      border: none !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      transition: background 0.15s ease !important;
    }
    [role="dialog"] button[aria-label="Previous"]:hover,
    [role="dialog"] button[aria-label="Next"]:hover {
      background: rgba(6, 78, 59, 0.14) !important;
    }

    /* ── Weekday column headers (Mo Tu We…) ─────────────────────────── */
    [role="columnheader"],
    [role="columnheader"] abbr {
      color: rgba(6, 78, 59, 0.38) !important;
      font-size: 0.6rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.14em !important;
      text-transform: uppercase !important;
      text-decoration: none !important;
    }

    /* ── Day cells ───────────────────────────────────────────────────── */
    [role="gridcell"] button {
      border-radius: 8px !important;
      font-size: 0.83rem !important;
      font-weight: 500 !important;
      color: #064E3B !important;
      transition: background 0.12s ease, color 0.12s ease !important;
    }

    /* Hover on available, unselected days */
    [role="gridcell"] button:not([aria-disabled="true"]):not([disabled]):hover {
      background: rgba(52, 211, 153, 0.2) !important;
      color: #064E3B !important;
    }

    /* Disabled / unavailable days */
    [role="gridcell"] button[aria-disabled="true"],
    [role="gridcell"] button[disabled] {
      color: rgba(6, 78, 59, 0.2) !important;
      background: transparent !important;
      cursor: default !important;
    }

    /* Today indicator */
    [role="gridcell"] button[aria-current="date"] {
      border: 1.5px solid rgba(52, 211, 153, 0.55) !important;
    }

    /* ── Guests dialog — force site font on every element ────────────── */
    [data-testid="book-now-box.guests-breakdown-dialog"],
    [data-testid="book-now-box.guests-breakdown-dialog"] * {
      font-family: 'Nunito', 'DM Sans', system-ui, sans-serif !important;
    }

    /* Guest type name (Adults, Children…) */
    [data-testid="book-now-box.guests-breakdown-dialog"] strong,
    [data-testid="book-now-box.guests-breakdown-dialog"] b {
      color: #064E3B !important;
      font-weight: 700 !important;
    }

    /* Age description ("Ages 18 and above") */
    [data-testid="book-now-box.guests-breakdown-dialog"] p,
    [data-testid="book-now-box.guests-breakdown-dialog"] span:not([data-testid]) {
      color: rgba(6, 78, 59, 0.55) !important;
      font-size: 0.8rem !important;
    }

    /* Guest count number */
    [data-testid*="guests-count"],
    [data-testid*="-count"] {
      color: #064E3B !important;
      font-weight: 700 !important;
      font-size: 0.95rem !important;
    }

    /* ── Responsive — ensure widget never overflows its iframe ───────── */
    * { max-width: 100%; }

    @media (max-width: 360px) {
      [data-testid="book-now-box.date-picker.trigger"] {
        flex-direction: column !important;
        gap: 0.5rem !important;
      }
    }
  </style>
</head>
<body>
  <div
    id="lodgify-book-now-box"
    data-website-id="655774"
    data-slug="allan-alvarez-d17ba1"
    data-language-code="en"
    data-new-tab="true"
    data-version="stable"
    data-has-guests-breakdown=""
    data-check-in-label="Check-in"
    data-check-out-label="Check-out"
    data-guests-label="Guests"
    data-guests-singular-label="{{NumberOfGuests}} guest"
    data-guests-plural-label="{{NumberOfGuests}} guests"
    data-total-price-label="Total:"
    data-select-dates-to-see-price-label="Select dates to see total price"
    data-minimum-price-per-night-first-label="From"
    data-minimum-price-per-night-second-label="/ night"
    data-book-button-label="Book now"
    data-guests-breakdown-label="Guests"
    data-adults-label='{"one":"adult","other":"adults"}'
    data-adults-description="Ages {minAge} and above"
    data-children-label='{"one":"child","other":"children"}'
    data-children-description="Ages {minAge} - {maxAge}"
    data-children-not-allowed-label="Not suitable for children"
    data-infants-label='{"one":"infant","other":"infants"}'
    data-infants-description="Under {maxAge}"
    data-infants-not-allowed-label="Not suitable for infants"
    data-pets-label='{"one":"pet","other":"pets"}'
    data-pets-not-allowed-label="Pets not allowed"
    data-done-label="Done"
  ></div>

  <script>
    // ── Read params from URL ─────────────────────────────────────────────────
    const params   = new URLSearchParams(location.search)
    const rentalId = params.get('rentalId') ?? ''
    const arrival  = params.get('arrival')  ?? ''   // YYYYMMDD
    const departure= params.get('departure')?? ''   // YYYYMMDD
    const adults   = parseInt(params.get('adults') ?? '1', 10)
    const lang     = params.get('lang') ?? 'en'     // 'en' | 'es'

    // Stamp attributes onto the widget div BEFORE renderBookNowBox.js runs
    // (it's defer, so our inline script always wins the race).
    const _box = document.getElementById('lodgify-book-now-box')
    if (rentalId) _box.setAttribute('data-rental-id', rentalId)

    // ── Language / localisation ──────────────────────────────────────────────
    // Set the Lodgify language code so the widget fetches translated content,
    // then override every visible label to match the site's active language.
    _box.setAttribute('data-language-code', lang)
    if (lang === 'es') {
      _box.setAttribute('data-check-in-label',                      'Llegada')
      _box.setAttribute('data-check-out-label',                     'Salida')
      _box.setAttribute('data-guests-label',                        'Huéspedes')
      _box.setAttribute('data-guests-singular-label',               '{{NumberOfGuests}} huésped')
      _box.setAttribute('data-guests-plural-label',                 '{{NumberOfGuests}} huéspedes')
      _box.setAttribute('data-total-price-label',                   'Precio total:')
      _box.setAttribute('data-select-dates-to-see-price-label',     'Seleccione las fechas para ver el precio total')
      _box.setAttribute('data-minimum-price-per-night-first-label', 'Desde')
      _box.setAttribute('data-minimum-price-per-night-second-label','por noche')
      _box.setAttribute('data-book-button-label',                   'Reservar ahora')
      _box.setAttribute('data-guests-breakdown-label',              'Huéspedes')
      _box.setAttribute('data-adults-label',                        '{"one":"adulto","other":"adultos"}')
      _box.setAttribute('data-adults-description',                  'Edades {minAge} o mayores')
      _box.setAttribute('data-children-label',                      '{"one":"niño","other":"niños"}')
      _box.setAttribute('data-children-description',                'Edades {minAge} - {maxAge}')
      _box.setAttribute('data-children-not-allowed-label',          'No adaptado para niños')
      _box.setAttribute('data-infants-label',                       '{"one":"bebé","other":"bebés"}')
      _box.setAttribute('data-infants-description',                 'Menos de {maxAge}')
      _box.setAttribute('data-infants-not-allowed-label',           'No adaptado para bebés')
      _box.setAttribute('data-pets-label',                          '{"one":"mascota","other":"mascotas"}')
      _box.setAttribute('data-pets-not-allowed-label',              'No permitido')
      _box.setAttribute('data-done-label',                          'Hecho')
    }

    // ── Native guests pre-fill ───────────────────────────────────────────────
    // Lodgify's script reads these attributes during initialisation.
    // Setting them here means the widget boots with the correct count so no
    // click-automation is needed for guests in most cases.
    if (adults > 1) {
      _box.setAttribute('data-adults',           String(adults))
      _box.setAttribute('data-number-of-adults', String(adults))
      _box.setAttribute('data-guests',           String(adults))
    }

    // ── Height reporter ──────────────────────────────────────────────────────
    // Dialogs (calendar, guests) are fixed-position and don't affect body.scrollHeight.
    // We measure them via getBoundingClientRect and also attach a ResizeObserver to
    // each one so every animation frame gets reported to the parent iframe.
    const _seenDialogs = new WeakSet()
    let _heightTimer = null

    function reportHeight() {
      let h = document.body.scrollHeight
      for (const dialog of document.querySelectorAll('[role="dialog"]')) {
        const rect = dialog.getBoundingClientRect()
        if (rect.height > 0) {
          h = Math.max(h, Math.ceil(window.scrollY + rect.bottom) + 32)
        }
        if (!_seenDialogs.has(dialog)) {
          _seenDialogs.add(dialog)
          // Track this dialog's size through its open animation.
          new ResizeObserver(reportHeight).observe(dialog)
        }
      }
      window.parent.postMessage({ type: 'ldg-widget-height', height: h }, '*')
    }

    // Body resize (widget content changes).
    new ResizeObserver(reportHeight).observe(document.body)

    // DOM mutations (dialogs appearing). Also schedule a re-check after 350 ms
    // so CSS open-transitions that finish after the initial insert are captured.
    new MutationObserver(() => {
      reportHeight()
      clearTimeout(_heightTimer)
      _heightTimer = setTimeout(reportHeight, 350)
    }).observe(document.body, { childList: true, subtree: true })

    // ── Calendar pre-fill helpers ────────────────────────────────────────────
    const MONTH_NAMES = [
      'January','February','March','April','May','June',
      'July','August','September','October','November','December',
    ]

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)) }

    // Invoke a React element's onClick handler directly via the internal
    // __reactProps key — this bypasses DOM event delegation entirely and is
    // the only approach that reliably works inside React portals (dialogs).
    function reactClick(el) {
      const propsKey = Object.keys(el).find(k => k.startsWith('__reactProps'))
      if (propsKey && el[propsKey]?.onClick) {
        el[propsKey].onClick({
          type: 'click', bubbles: true, cancelable: true,
          target: el, currentTarget: el,
          preventDefault:        () => {},
          stopPropagation:       () => {},
          isDefaultPrevented:    () => false,
          isPropagationStopped:  () => false,
          persist:               () => {},
          nativeEvent: new MouseEvent('click', { bubbles: true }),
        })
        return
      }
      // Fallback: full pointer + mouse sequence for non-React or older React
      el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 1, isPrimary: true }))
      el.dispatchEvent(new PointerEvent('pointerup',   { bubbles: true, cancelable: true, pointerId: 1, isPrimary: true }))
      el.dispatchEvent(new MouseEvent('mousedown',     { bubbles: true, cancelable: true, view: window }))
      el.dispatchEvent(new MouseEvent('mouseup',       { bubbles: true, cancelable: true, view: window }))
      el.dispatchEvent(new MouseEvent('click',         { bubbles: true, cancelable: true, view: window }))
    }

    function getVisibleCalendarMonth() {
      // Try scoped containers first (dialog, presentation), then the whole body.
      // This covers differences in how Lodgify renders the calendar popup across room types.
      const roots = [
        ...document.querySelectorAll('[role="dialog"]'),
        ...document.querySelectorAll('[role="presentation"]'),
        document.body,
      ]
      for (const root of roots) {
        for (const el of root.querySelectorAll('span, p, h2, h3, div')) {
          const text = (el.textContent ?? '').trim()
          const match = text.match(/^(\w+)\s+(\d{4})$/)
          if (match) {
            const idx = MONTH_NAMES.indexOf(match[1])
            if (idx !== -1) return { year: parseInt(match[2]), month: idx + 1 }
          }
        }
      }
      return null
    }

    async function navigateCalendarToMonth(targetYear, targetMonth) {
      for (let i = 0; i < 24; i++) {
        const current = getVisibleCalendarMonth()
        if (!current) {
          console.warn('[ldg-prefill] getVisibleCalendarMonth returned null — calendar may not be open')
          break
        }
        if (current.year === targetYear && current.month === targetMonth) break

        const goBack =
          current.year > targetYear ||
          (current.year === targetYear && current.month > targetMonth)

        const label = goBack ? 'Previous' : 'Next'
        // Prefer a dialog-scoped button, fall back to any matching button in the document.
        const btn =
          document.querySelector(`[role="dialog"] button[aria-label="${label}"]`) ??
          document.querySelector(`button[aria-label="${label}"]`)
        if (!btn) {
          console.warn(`[ldg-prefill] nav button "${label}" not found`)
          break
        }
        btn.click()
        await sleep(250)
      }
    }

    async function prefillBookingBox() {
      if (arrival.length !== 8 || departure.length !== 8) return

      const arrDay   = parseInt(arrival.slice(6, 8), 10)
      const arrMonth = parseInt(arrival.slice(4, 6), 10)
      const arrYear  = parseInt(arrival.slice(0, 4), 10)
      const depDay   = parseInt(departure.slice(6, 8), 10)
      const depMonth = parseInt(departure.slice(4, 6), 10)
      const depYear  = parseInt(departure.slice(0, 4), 10)

      const container = document.getElementById('lodgify-book-now-box')

      // ── 1. Open date picker ──────────────────────────────────────────────
      const dateTrigger = container.querySelector('[data-testid="book-now-box.date-picker.trigger"]')
      if (!dateTrigger) { console.warn('[ldg-prefill] date trigger not found'); return }
      console.log('[ldg-prefill] clicking date trigger')
      dateTrigger.click()
      await sleep(700)

      const monthAfterOpen = getVisibleCalendarMonth()
      console.log('[ldg-prefill] calendar open, visible month:', monthAfterOpen)

      // ── 2. Navigate to arrival month and click arrival date ──────────────
      await navigateCalendarToMonth(arrYear, arrMonth)
      await sleep(200)

      const arrCellTestid = `book-now-box.date-picker-calendar-cell-${arrDay}-${arrMonth}`
      const arrCell = document.querySelector(`[data-testid="${arrCellTestid}"]`)
      const arrDisabled = arrCell?.getAttribute('aria-disabled') === 'true'
      console.log('[ldg-prefill] arrival cell:', arrCellTestid, 'found:', !!arrCell, 'disabled:', arrDisabled)

      if (!arrCell || arrDisabled) {
        // Arrival date is blocked in Lodgify (room restriction or unavailability).
        // Leave the calendar open so the user can immediately pick available dates.
        console.warn('[ldg-prefill] arrival date unavailable — leaving calendar open for manual selection')
        return
      }
      arrCell.click()
      await sleep(400)

      // ── 3. Navigate to departure month and click departure date ──────────
      await navigateCalendarToMonth(depYear, depMonth)
      await sleep(200)

      const depCellTestid = `book-now-box.date-picker-calendar-cell-${depDay}-${depMonth}`
      const depCell = document.querySelector(`[data-testid="${depCellTestid}"]`)
      const depDisabled = depCell?.getAttribute('aria-disabled') === 'true'
      console.log('[ldg-prefill] departure cell:', depCellTestid, 'found:', !!depCell, 'disabled:', depDisabled)

      if (!depCell || depDisabled) {
        console.warn('[ldg-prefill] departure date unavailable — leaving calendar open')
        return
      }
      depCell.click()
      await sleep(300)

      // ── 4. Wait for the calendar dialog to fully close ───────────────────
      // Without this wait the calendar is still in the DOM when we look for
      // the guests trigger — it never finds it and returns early.
      const calCloseDeadline = Date.now() + 2500
      while (Date.now() < calCloseDeadline) {
        if (!document.querySelector('[role="dialog"]')) break
        await sleep(100)
      }
      await sleep(350) // extra settle so Lodgify finishes its close animation

      // ── 5. Pre-fill guests ───────────────────────────────────────────────
      // Uses exact data-testid selectors confirmed from live DOM inspection.
      // Re-queries the add button on every iteration because React re-renders
      // the dialog after each state update, which can replace the DOM node.
      if (adults > 1) {
        const guestsTrigger = container.querySelector('[data-testid="guests-breakdown-trigger"]')
        if (guestsTrigger) {
          reactClick(guestsTrigger)
          await sleep(700)

          // Lodgify starts at 1 adult — click Add (adults − 1) times
          for (let i = 1; i < adults; i++) {
            const addBtn = document.querySelector('[data-testid="adults-add-button"]')
            if (!addBtn) { console.warn('[ldg-prefill] add button gone after click', i); break }
            reactClick(addBtn)
            await sleep(350)
          }
          await sleep(200)

          const doneBtn = document.querySelector('[data-testid="book-now-box.guests-breakdown-done-cta"]')
          if (doneBtn) {
            reactClick(doneBtn)
            await sleep(400)
          }
        }
      }
    }

    // ── Click outside to close open dialogs ─────────────────────────────────────
    // Lodgify's calendar and guests dialogs don't close when clicking outside them.
    // This handler detects outside clicks and fires an Escape keydown on the open
    // dialog — Lodgify's React internals handle the close from there.
    // Runs in the bubbling phase (false) so it doesn't interfere with the capture-
    // phase checkout intercept below.
    document.addEventListener('click', function(e) {
      const openDialog = document.querySelector('[role="dialog"]')
      if (!openDialog) return

      // Click was inside the dialog itself → do nothing
      if (openDialog.contains(e.target)) return

      // Click was on one of the triggers that toggle the dialog → do nothing
      // (their own click handler will close it)
      const dateTrigger   = document.querySelector('[data-testid="book-now-box.date-picker.trigger"]')
      const guestsTrigger = document.querySelector('[data-testid="guests-breakdown-trigger"]')
      if (dateTrigger   && dateTrigger.contains(e.target))   return
      if (guestsTrigger && guestsTrigger.contains(e.target)) return

      // Outside click confirmed — send Escape to the dialog so React closes it
      openDialog.dispatchEvent(new KeyboardEvent('keydown', {
        key:        'Escape',
        code:       'Escape',
        keyCode:    27,
        which:      27,
        bubbles:    true,
        cancelable: true,
        composed:   true,
      }))
    }, false)

    // ── Receive close-dialogs signal from parent page ───────────────────────────
    // When the user clicks anywhere on the parent page (outside the iframe),
    // BookingRoom.tsx sends { type: 'ldg-close-dialogs' } via postMessage.
    // We dispatch Escape on any open dialog so Lodgify's React internals close it.
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'ldg-close-dialogs') return
      const openDialog = document.querySelector('[role="dialog"]')
      if (!openDialog) return
      openDialog.dispatchEvent(new KeyboardEvent('keydown', {
        key:        'Escape',
        code:       'Escape',
        keyCode:    27,
        which:      27,
        bubbles:    true,
        cancelable: true,
        composed:   true,
      }))
    })

    // ── Checkout intercept ───────────────────────────────────────────────────────
    // Lodgify's "Book now" renders as an <a href="https://checkout.lodgify.com/...">
    // with data-new-tab="true". We intercept the click before it opens a new tab,
    // fire a postMessage to the parent so it can show the reminder modal, and let
    // the parent open the URL once the user confirms.
    document.addEventListener('click', function(e) {
      let el = e.target
      while (el && el !== document.body) {
        if (el.tagName === 'A' && typeof el.href === 'string' && el.href.includes('checkout.lodgify.com')) {
          e.preventDefault()
          e.stopImmediatePropagation()
          window.parent.postMessage({ type: 'ldg-checkout-intercept', url: el.href }, '*')
          return
        }
        el = el.parentElement
      }
    }, true) // capture phase — fires before React's synthetic event handlers

    // ── Poll until the widget is ready, prefill dates, wait for pricing ────────
    // The parent keeps its spinner until it receives ldg-widget-ready, so we
    // only send that signal after the full flow: render → prefill → price loaded.
    // This means the user never sees the date-click animation or the loading state.
    ;(function startPoller() {
      const deadline = Date.now() + 20000

      async function revealWidget() {
        if (arrival.length === 8 && departure.length === 8) {
          // Run prefill (clicks dates in the calendar).
          await prefillBookingBox().catch(() => {})

          // If no dialog is open after prefill, both dates were accepted and
          // Lodgify is fetching the price. Poll for "Total" to appear, which
          // means the price API has responded and the widget is fully ready.
          // If a dialog is still open (dates unavailable, calendar left open),
          // skip the price wait and reveal immediately.
          if (!document.querySelector('[role="dialog"]')) {
            const container = document.getElementById('lodgify-book-now-box')
            const priceDeadline = Date.now() + 5000
            while (Date.now() < priceDeadline) {
              if (container?.textContent?.toLowerCase().includes('total')) break
              await sleep(300)
            }
          }
        }
        reportHeight()
        window.parent.postMessage({ type: 'ldg-widget-ready' }, '*')
      }

      const id = setInterval(() => {
        const trigger = document.querySelector('[data-testid="book-now-box.date-picker.trigger"]')
        if (trigger) {
          clearInterval(id)
          revealWidget()
        } else if (Date.now() > deadline) {
          clearInterval(id)
          // Timeout fallback — reveal whatever rendered.
          window.parent.postMessage({ type: 'ldg-widget-ready' }, '*')
        }
      }, 400)
    })()
  </script>

  <script
    src="https://app.lodgify.com/book-now-box/stable/renderBookNowBox.js"
    defer
  ></script>
</body>
</html>
