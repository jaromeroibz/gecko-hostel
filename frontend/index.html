<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicons ─────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ── Base meta (react-helmet-async overrides these per-page) ───────── -->
    <title>Gecko Surf House | Surf Hostel in Santa Teresa, Costa Rica</title>
    <meta name="description" content="Boutique surf hostel 3 minutes from Playa Carmen, Santa Teresa, Costa Rica. Surf packages from $890, private rooms &amp; shared dorms for backpackers and surfers." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#064E3B" />
    <link rel="canonical" href="https://geckosurfhouse.com/" />

    <!-- ── Geographic / local SEO signals ──────────────────────────────── -->
    <meta name="geo.region" content="CR-P" />
    <meta name="geo.placename" content="Santa Teresa, Puntarenas, Costa Rica" />
    <meta name="geo.position" content="9.6320219;-85.1573193" />
    <meta name="ICBM" content="9.6320219, -85.1573193" />

    <!-- ── OpenGraph base (react-helmet-async overrides per page) ────────── -->
    <meta property="og:site_name"   content="Gecko Surf House" />
    <meta property="og:type"        content="website" />
    <meta property="og:locale"      content="en_US" />
    <meta property="og:title"       content="Gecko Surf House | Surf Hostel in Santa Teresa, Costa Rica" />
    <meta property="og:description" content="Boutique surf hostel 3 minutes from Playa Carmen, Santa Teresa, Costa Rica. Surf packages from $890, private rooms &amp; shared dorms." />
    <meta property="og:url"         content="https://geckosurfhouse.com/" />
    <meta property="og:image"       content="https://res.cloudinary.com/doow0mhrm/image/upload/f_auto,q_auto,w_1200,h_630,c_fill,g_auto/v1778627977/frames-for-your-heart-eBSKJJuPeO8-unsplash_uc6ksc.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Gecko Surf House — beachside surf hostel in Santa Teresa, Costa Rica" />

    <!-- ── Twitter / X Card ─────────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@geckosurfhouse" />
    <meta name="twitter:title"       content="Gecko Surf House | Surf Hostel in Santa Teresa, Costa Rica" />
    <meta name="twitter:description" content="Boutique surf hostel 3 minutes from Playa Carmen, Santa Teresa, Costa Rica. Surf packages from $890, private rooms &amp; shared dorms." />
    <meta name="twitter:image"       content="https://res.cloudinary.com/doow0mhrm/image/upload/f_auto,q_auto,w_1200,h_630,c_fill,g_auto/v1778627977/frames-for-your-heart-eBSKJJuPeO8-unsplash_uc6ksc.jpg" />

    <!-- ── DNS pre-connect ──────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://app.lodgify.com" crossorigin />
    <link rel="dns-prefetch" href="https://checkout.lodgify.com" />

    <!-- ── Font stylesheet ──────────────────────────────────────────────── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@300..700&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Work+Sans:wght@300..600&family=Nunito:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!-- ── LCP image preload — hero background, above the fold ─────────── -->
    <!-- fetchpriority=high tells the browser to fetch this before JS parses -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/doow0mhrm/image/upload/f_auto,q_auto,w_1200/v1778627977/frames-for-your-heart-eBSKJJuPeO8-unsplash_uc6ksc.jpg"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
